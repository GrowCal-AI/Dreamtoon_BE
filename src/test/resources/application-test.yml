# Test Profile Configuration
spring:
  datasource:
    # PostgreSQL 호환 모드: jsonb 컬럼 타입 지원을 위해 MODE=PostgreSQL 사용
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  ai:
    openai:
      api-key: test-api-key
  
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-id
            client-secret: test-kakao-secret
          google:
            client-id: test-google-id
            client-secret: test-google-secret

  cloud:
    gcp:
      project-id: test-project
      storage:
        bucket: test-bucket

jwt:
  secret: test-jwt-secret-key-for-testing-must-be-at-least-256-bits-long-for-security
  expiration: 3600000
  refresh-expiration: 604800000  # 7일 (테스트용)



logging:
  level:
    root: INFO
    com.dreamtoon: DEBUG
