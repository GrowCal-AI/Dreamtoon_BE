spring:
  # 운영 환경 데이터베이스 설정
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: validate  # 운영에서는 직접 마이그레이션 관리
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  # 운영 환경 CORS 설정
  web:
    cors:
      allowed-origins: 
        - ${FRONTEND_URL}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      allow-credentials: true

# 운영 환경 로깅
logging:
  level:
    root: INFO
    com.dreamtoon: INFO
    org.springframework.security: WARN
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: /var/log/dreamtoon/application.log
    max-size: 100MB
    max-history: 30

# 운영 환경 서버 설정
server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# 운영 환경 변수는 모두 시스템 환경 변수로 주입
# DATABASE_URL=jdbc:postgresql://prod-db-host:5432/dreamtoon_prod
# DB_USERNAME=prod_user
# DB_PASSWORD=prod_password
# OPENAI_API_KEY=prod-openai-key
# GOOGLE_CLIENT_ID=prod-google-client-id
# GOOGLE_CLIENT_SECRET=prod-google-client-secret
# KAKAO_CLIENT_ID=prod-kakao-client-id
# KAKAO_CLIENT_SECRET=prod-kakao-client-secret
# AWS_ACCESS_KEY_ID=prod-aws-access-key
# AWS_SECRET_ACCESS_KEY=prod-aws-secret-key
# AWS_S3_BUCKET=dreamtoon-prod-bucket
# JWT_SECRET=prod-jwt-secret-key-min-256-bits
# FRONTEND_URL=https://dreamtoon.com
