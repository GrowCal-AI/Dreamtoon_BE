spring:
  # 로컬 개발 환경 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/dreamtoon_dev
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: update  # 로컬에서는 자동 스키마 업데이트
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  
  # 로컬 환경 CORS 설정
  web:
    cors:
      allowed-origins: 
        - http://localhost:3000
        - http://localhost:3001
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      allow-credentials: true

# 로컬 환경 로깅
logging:
  level:
    root: INFO
    com.dreamtoon: DEBUG
    org.springframework.security: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 로컬 환경 서버 설정
server:
  port: 8080

# 로컬 환경 변수 예시 (실제로는 .env 파일이나 환경 변수 사용)
# OPENAI_API_KEY=your-local-openai-key
# GOOGLE_CLIENT_ID=your-google-client-id
# GOOGLE_CLIENT_SECRET=your-google-client-secret
# KAKAO_CLIENT_ID=your-kakao-client-id
# KAKAO_CLIENT_SECRET=your-kakao-client-secret
# AWS_ACCESS_KEY_ID=your-aws-access-key
# AWS_SECRET_ACCESS_KEY=your-aws-secret-key
# AWS_S3_BUCKET=dreamtoon-dev-bucket
# JWT_SECRET=your-jwt-secret-key-min-256-bits
