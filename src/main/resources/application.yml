spring:
  application:
    name: dreamtoon-backend
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  # JPA 공통 설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update  # 개발: update | 프로덕션: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
  
  # Spring AI OpenAI 설정
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
      image:
        options:
          model: dall-e-3
          quality: standard
          size: 1024x1792  # 웹툰 세로 비율
          style: vivid
  
  # Security OAuth2 공통 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "${BACKEND_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${BACKEND_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              # - account_email  # 카카오 콘솔에서 동의 항목 설정 후 주석 해제
            client-name: Kakao
        
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  
  # GCP Storage 설정
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}
      storage:
        bucket: ${GCS_BUCKET_NAME}

# 이미지 생성 프로바이더 설정 (dalle | gpt-image)
image:
  provider: ${IMAGE_PROVIDER:dalle}
  gpt-image:
    quality: ${GPT_IMAGE_QUALITY:medium}  # low | medium | high

# OAuth2 설정
app:
  oauth2:
    # 소셜 로그인 후 리다이렉트 허용 목록 (보안: 이 목록에 없는 redirect_uri는 무시됨)
    # @Value 주입을 위해 콤마 구분 문자열 형식 사용
    allowed-redirect-uris: "https://dreamics.ai.kr,https://www.dreamics.ai.kr,http://localhost:5173,http://localhost:3000"

# Polar.sh 결제 연동
polar:
  api-key: ${POLAR_API_KEY:}
  webhook-secret: ${POLAR_WEBHOOK_SECRET:}
  base-url: https://api.polar.sh/v1
  sandbox: ${POLAR_SANDBOX:false}
  products:
    plus: ${POLAR_PRODUCT_PLUS:}
    pro: ${POLAR_PRODUCT_PRO:}
    ultra: ${POLAR_PRODUCT_ULTRA:}
  success-url: ${POLAR_SUCCESS_URL:http://localhost:3000/payment/success}
  portal-return-url: ${POLAR_PORTAL_RETURN_URL:http://localhost:3000/settings}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}  # 1시간 (밀리초)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7일

# Logging
logging:
  level:
    root: INFO
    com.dreamtoon: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# 서버 설정
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
