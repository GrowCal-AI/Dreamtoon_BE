name: Deploy to GCE

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: dreamtoon-487717
  REGION: asia-northeast3
  REPO: dreamtoon
  IMAGE_NAME: dreamtoon-be
  GCE_INSTANCE: dreamtoon-backend
  GCE_ZONE: asia-northeast3-a
  IMAGE_TAG: asia-northeast3-docker.pkg.dev/dreamtoon-487717/dreamtoon/dreamtoon-be:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. 코드 체크아웃 ──────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 설정 ───────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle 캐시 ────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 4. 테스트 실행 ────────────────────────────────────
      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      # ── 5. GCP 인증 ───────────────────────────────────────
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ── 6. gcloud CLI 설정 ────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── 7. Artifact Registry Docker 인증 ─────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── 8. Docker 이미지 빌드 ─────────────────────────────
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_TAG }} .

      # ── 9. Artifact Registry에 푸시 ───────────────────────
      - name: Push to Artifact Registry
        run: docker push ${{ env.IMAGE_TAG }}

      # ── 10. GCE SSH 배포 ──────────────────────────────────
      - name: Deploy to GCE
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          script: |
            gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
            cd /opt/dreamtoon
            docker pull asia-northeast3-docker.pkg.dev/dreamtoon-487717/dreamtoon/dreamtoon-be:latest
            docker compose -f docker-compose.prod.yml up -d --force-recreate app
            docker image prune -f
